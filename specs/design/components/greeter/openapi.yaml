openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: A small public API that returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name, or a generic greeting when none is given
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        name:
          type: string
          description: The name that was greeted, when one was given
        message:
          type: string
          description: The greeting text, e.g. "Hello, World!" or "Hello, Alice!"
